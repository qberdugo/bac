<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mes révisions</title>
<link rel="stylesheet" href="assets/site.css">
</head>
<body>

<header>
  <h1>✨ Mes révisions</h1>
  <p>Chaque chapitre est découpé en parties. Pour chaque partie : un cours interactif à manipuler, et une fiche de révision à garder sous la main (et à télécharger).</p>
</header>

<main id="contenu">
  <noscript><section><p>Active JavaScript pour voir la liste des chapitres.</p></section></noscript>
</main>

<footer>Fait avec ❤️ — de nouveaux chapitres arrivent au fil de l'année.</footer>

<script src="chapitres.js"></script>
<script>
"use strict";
const contenu = document.getElementById("contenu");
MATIERES.forEach(matiere => {
  const section = document.createElement("section");
  const chips = `<span class="chip" style="background:${matiere.couleur};color:${matiere.texte || "#fff"}">${matiere.emoji} ${matiere.nom}</span>`;
  const blocs = matiere.chapitres.map(chap => {
    const cartes = chap.parties.map(pt => `
    <div class="partie" style="border-left:6px solid ${matiere.couleur}">
      <h4>${pt.emoji} ${pt.titre}</h4>
      <p>${pt.description}</p>
      <div class="boutons">
        <a class="btn btn-cours" href="${pt.dossier}/cours.html">▶️ Cours interactif</a>
        <a class="btn btn-fiche" href="${pt.dossier}/fiche.html">📄 Fiche de révision</a>
        <a class="btn btn-pdf" href="${pt.dossier}/${pt.pdf}" download>⬇️ PDF</a>
      </div>
    </div>`).join("");
    return `<h3 class="chapitre-titre">${chap.emoji} ${chap.titre}</h3>` + cartes;
  }).join("");
  section.innerHTML = chips + blocs;
  contenu.appendChild(section);
});
const aVenir = document.createElement("section");
aVenir.innerHTML = `<span class="chip" style="background:#8a8aa8">🔜 À venir</span>
  <p class="a-venir">La suite du chapitre sur les équations du second degré (discriminant et résolution, forme factorisée, signe du trinôme…), et peut-être d'autres matières. La liste s'allonge au fil de l'année !</p>`;
contenu.appendChild(aVenir);
</script>
</body>
</html>
